name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tracker_test
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: tracker_test
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_dev
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-secret-key-testing
      DJANGO_DEBUG: "1"
      TMDB_API_KEY: ""
      RAPIDAPI_KEY: ""
      # Aggregator sources must degrade to an explicit auth error without a
      # key, so CI proves that instead of requiring a secret.
      WATCHMODE_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Run database migrations
        run: python manage.py migrate

      - name: Run backend tests
        # `availability` is included deliberately: the source collectors,
        # migrations and reconciliation suite lives there, and CI previously
        # ran `tracker` only, so none of it was executed.
        run: python manage.py test tracker availability -v 2 --noinput

  frontend:
    name: Frontend Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Run frontend tests
        run: npm test

  extension:
    name: Browser Extension Build, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Typecheck extension
        run: npm run typecheck

      - name: Run extension tests
        run: npm test

      - name: Build installable package
        run: npm run build

      - name: Validate packaged Manifest V3 extension
        run: npm run validate:package
