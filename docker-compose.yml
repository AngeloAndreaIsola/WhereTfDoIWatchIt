services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 3 --threads 2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      WATCHMODE_API_KEY: ${WATCHMODE_API_KEY:-}
      DEFAULT_PREFERENCE_PROVIDER: ${DEFAULT_PREFERENCE_PROVIDER:-prime}
      # Consult the metered aggregator only for titles a cheaper source has
      # not already resolved. Set on both the service that enqueues and the
      # worker that drains, since the gate is enforced at both ends: the
      # backend decides whether a metered request is created, and the worker
      # re-checks before spending the request.
      #
      # Defaults to off so that switching the ladder on is a measured,
      # reversible deployment decision rather than a side effect of a redeploy.
      AVAILABILITY_CONSULT_METERED_ONLY_WHEN_UNRESOLVED: ${AVAILABILITY_CONSULT_METERED_ONLY_WHEN_UNRESOLVED:-0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    command: npm run start
    environment:
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # Both lanes share one image, one environment and one entrypoint, so the
  # shared parts are an anchor: a divergence between the two workers'
  # configuration would be a silent bug (the ladder switch below, for instance,
  # must be identical in both or a request could be queued under one policy and
  # settled under another).
  #
  # `worker` owns the title lane and `catalogue-worker` owns whole-catalogue
  # syncs. They are separate processes because the two kinds of work have
  # completely different durations: a title check is one bounded upstream call,
  # while ABC iview's catalogue walk fetches ~1613 series detail pages and
  # measurably takes ~30 minutes. In one thread a single catalogue walk blocked
  # every already-queued title request for half an hour.
  #
  # `--lane both` remains the default for a single-process deployment; this
  # split is opt-in and only changes *who* does the work, never what is
  # computed from persisted state afterwards.
  worker: &worker-base
    build: ./backend
    entrypoint: ["/worker-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      WATCHMODE_API_KEY: ${WATCHMODE_API_KEY:-}
      DEFAULT_PREFERENCE_PROVIDER: ${DEFAULT_PREFERENCE_PROVIDER:-prime}
      # Same ladder switch as the backend. The worker enforces the gate at
      # drain time independently, so a request that became unnecessary while
      # queued is settled without being attempted — which only works if this
      # process is configured with the same policy as the one that queued it.
      AVAILABILITY_CONSULT_METERED_ONLY_WHEN_UNRESOLVED: ${AVAILABILITY_CONSULT_METERED_ONLY_WHEN_UNRESOLVED:-0}
    command: python manage.py refresh_worker --lane title
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  catalogue-worker:
    # Inherits image, environment, dependencies and restart policy from `worker`
    # above. The two must not diverge: a worker configured with a different source
    # ladder would settle requests under a policy the queueing process never used.
    <<: *worker-base
    command: python manage.py refresh_worker --lane catalogue

volumes:
  pgdata:
